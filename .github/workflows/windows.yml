name: Windows build and tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 40
    steps:
      - name: Checkout source and pinned JUCE
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: recursive
          persist-credentials: false
      - name: Verify dependency
        shell: pwsh
        run: |
          $actual = git -C third_party/JUCE rev-parse HEAD
          if ($LASTEXITCODE -ne 0 -or $actual -ne '29396c22c93392d6738e021b83196283d6e4d850') {
            throw 'Unexpected JUCE commit'
          }
      - name: Configure
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64 -DANYVOC_BUILD_TESTS=ON
      - name: Build Release
        run: cmake --build build --config Release --parallel 2
      - name: Run all four test suites
        run: ctest --test-dir build -C Release --output-on-failure --output-junit test-results.xml
      - name: Keep test evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-test-evidence
          path: |
            build/Testing/Temporary/
            build/test-results.xml
          if-no-files-found: warn
